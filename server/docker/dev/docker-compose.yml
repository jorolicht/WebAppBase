name: ${APP_NAME}

services:
  # Reverse Proxy (Traefik), der den HTTPS-Traffic verwaltet.
  # Routing nur über dynamic_config.toml (kein Docker-Provider): sonst würde eine parallel laufende
  # Traefik-Instanz eines anderen Projekts die Labels dieser Container ebenfalls übernehmen.
  reverse-proxy:
    image: traefik:v3.6.2
    command:
      - "--log.level=INFO"
    
      # 1. Entrypoints definieren
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    
      # 2. Globale Weiterleitung von Port 80 (web) nach Port 443 (websecure) einrichten
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    
      - "--providers.file.filename=/etc/traefik/dynamic_config.toml"
    ports:
      - "${HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./certs:/etc/traefik/certs:ro
      - ./dynamic_config.toml:/etc/traefik/dynamic_config.toml:ro
    networks:
      - proxy

  wordpress:
    image: webapp-wp-image
    build:
      context: .
      dockerfile: wordpress/Dockerfile
    container_name: webapp-wp
    depends_on:
      - db
      - mailcatcher
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      # Social-Media-Links im Footer (leer = Button ausgeblendet)
      SOCIAL_FACEBOOK_URL: ${SOCIAL_FACEBOOK_URL:-}
      SOCIAL_X_URL: ${SOCIAL_X_URL:-}
      SOCIAL_INSTAGRAM_URL: ${SOCIAL_INSTAGRAM_URL:-}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', "${WP_URL}" );
        define( 'WP_SITEURL', "${WP_URL}" );
        define( 'PLAY_SERVER_URL', "${PLAY_SERVER_URL}" );
        define( 'FS_METHOD', 'direct' );
        define( 'WEBAPP_MAILCATCHER', true );

    expose:
      - "80"
    volumes:
      - ./wp_data:/var/www/html
    networks:
      - proxy
      - backend

  wp-cli:
    image: wordpress:cli
    container_name: webapp-cli
    user: root
    volumes:
      - ./wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', "${WP_URL}" );
        define( 'WP_SITEURL', "${WP_URL}" );
        define( 'PLAY_SERVER_URL', "${PLAY_SERVER_URL}" );
        define( 'FS_METHOD', 'direct' );
    depends_on:
      - db
    networks:
      - backend
    command: |
      bash -c '
      # Deaktiviert erzwungenes SSL im MariaDB-Client (ab Version 11.4 Standard)
      echo -e "\n[client]\nskip-ssl = true" >> /etc/my.cnf

      # Erstelle Wrapper-Skripte für alle MariaDB-Befehle, um --skip-ssl zu erzwingen (da wp-cli --no-defaults nutzt)
      for cmd in mariadb mysql mariadb-check mysqlcheck mariadb-dump mysqldump; do
        echo -e "#!/bin/sh\nexec /usr/bin/$$cmd \"\$$@\" --skip-ssl" > /usr/local/bin/$$cmd
        chmod +x /usr/local/bin/$$cmd
      done

      tail -f /dev/null
      '

  db:
    image: mariadb:10.11
    container_name: webapp-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - backend

  playsrv:
    image: webapp-playsrv-image
    container_name: webapp-playsrv
    build:
      context: playsrv
      dockerfile: Dockerfile
      args:
        - APP_HOME=${APP_HOME}
        - PLAY_WP_URL=${PLAY_WP_URL}
        - PLAY_WP_CPT=${PLAY_WP_CPT}
        - APP_VERSION=${APP_VERSION}
        - DEMON_USER=${DEMON_USER}
        - DEMON_USERID=${DEMON_USERID}
    labels:
      - "MAINTAINER=${APP_MAINTAINER}"
      - "VENDOR=${APP_VENDOR}"
      - "IMAGE_DESCRIPTION=This Dockerfile creates an image with the WebAppBase App running on it."

    environment:
      APP_VERSION: ${APP_VERSION}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      APP_DATE: ${APP_DATE}   
      PLAY_LOGFILE_PATH: ${APP_HOME}/logs
      PLAY_PIDFILE_PATH: ${PLAY_PIDFILE_PATH}
      DB_DEFAULT_URL: ${DB_DEFAULT_URL}
      DB_DEFAULT_DRIVER: ${DB_DEFAULT_DRIVER}
      DB_DEFAULT_USERNAME: ${DB_DEFAULT_USERNAME}
      DB_DEFAULT_PASSWORD: ${DB_DEFAULT_PASSWORD}
      PLAY_WP_URL: ${PLAY_WP_URL}
      PLAY_WP_CPT: ${PLAY_WP_CPT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      PLAY_HTTP_PORT: ${PLAY_HTTP_PORT}
      PLAY_HTTP_HOST: ${PLAY_HTTP_HOST}
      PLAY_HTTP_SECRET_KEY: ${PLAY_HTTP_SECRET_KEY}
      PLAY_MAILER_HOST: ${PLAY_MAILER_HOST}
      PLAY_MAILER_PORT: ${PLAY_MAILER_PORT}
      PLAY_MAILER_USER: ${PLAY_MAILER_USER}
      PLAY_MAILER_PASSWORD: ${PLAY_MAILER_PASSWORD}
      PLAY_MAILER_DEBUG: ${PLAY_MAILER_DEBUG}
      PLAY_MAILER_MOCK: ${PLAY_MAILER_MOCK}
    expose:
     - "${PLAY_HTTP_PORT}"
    volumes:
      - "./logs:${APP_HOME}/logs:rw"
    depends_on:
      - db
    networks:
      - proxy
      - backend

  mailcatcher:
    image: sj26/mailcatcher:latest
    container_name: webapp-mailcatcher
    restart: unless-stopped
    expose:
      - "1025"
      - "1080"
    ports:
      - "${MAILCATCHER_PORT:-1081}:1080"
    networks:
      - backend

  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - ./wp_data:/app
    user: "${UID:-1000}:${GID:-1000}"
    profiles:
      - tools
    networks:
      - backend      

networks:
  proxy:
    name: webapp-proxy
  backend:
    name: webapp-backend